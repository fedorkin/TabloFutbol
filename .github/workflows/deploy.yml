name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GROUP_CHAT_ID: ${{ vars.GROUP_CHAT_ID }}  # необязательно: иначе берётся из wrangler.toml
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck & tests
        run: npm run typecheck && npm test

      - name: Check secrets
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN; do
            if [ -z "${!s}" ]; then echo "::error::Не задан секрет $s (Settings → Secrets and variables → Actions)"; exit 1; fi
          done
          # Секрет вебхука выводим из токена бота — стабилен между деплоями, отдельно хранить не нужно
          echo "WEBHOOK_SECRET=$(printf %s "$BOT_TOKEN" | sha256sum | cut -c1-40)" >> "$GITHUB_ENV"

      - name: Ensure D1 database
        run: |
          list=$(scripts/ci-run.sh npx wrangler d1 list --json) || exit 1
          id=$(jq -r '.[] | select(.name=="soccer") | .uuid' <<<"$list")
          if [ -z "$id" ]; then
            scripts/ci-run.sh npx wrangler d1 create soccer || exit 1
            list=$(scripts/ci-run.sh npx wrangler d1 list --json) || exit 1
            id=$(jq -r '.[] | select(.name=="soccer") | .uuid' <<<"$list")
          fi
          echo "D1 id: $id"
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml

      - name: Apply migrations
        run: scripts/ci-run.sh npx wrangler d1 migrations apply soccer --remote

      - name: Deploy worker
        run: |
          args=(); [ -n "$GROUP_CHAT_ID" ] && args=(--var "GROUP_CHAT_ID:$GROUP_CHAT_ID")
          scripts/ci-run.sh npx wrangler deploy "${args[@]}" > deploy.log || { cat deploy.log; exit 1; }
          cat deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::Не нашёл адрес workers.dev в выводе deploy"; exit 1; fi
          echo "WORKER_URL=$url" >> "$GITHUB_ENV"

      - name: Upload bot secrets
        run: |
          jq -n --arg b "$BOT_TOKEN" --arg w "$WEBHOOK_SECRET" '{BOT_TOKEN:$b, WEBHOOK_SECRET:$w}' > secrets.json
          scripts/ci-run.sh npx wrangler secret bulk secrets.json; code=$?
          rm secrets.json; exit $code

      - name: Register Telegram webhook
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "$WORKER_URL/setup?secret=$WEBHOOK_SECRET" -o setup.json; then
              jq '{ok, webhook, pending: .info.pending_update_count, last_error: .info.last_error_message}' setup.json
              echo "::notice title=Telegram webhook::$(jq -r '"ok=\(.ok) pending=\(.info.pending_update_count) last_error=\(.info.last_error_message // "нет")"' setup.json)"
              echo "::notice title=GROUP_CHAT_ID::${GROUP_CHAT_ID:-из wrangler.toml: $(grep -oP '^GROUP_CHAT_ID = "\K[^"]+' wrangler.toml)}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Не удалось вызвать /setup"; exit 1

      - name: Summary
        run: |
          {
            echo "### ✅ Бот задеплоен"
            echo "- Worker: $WORKER_URL"
            if [ -z "$GROUP_CHAT_ID" ] && grep -q '^GROUP_CHAT_ID = "0"' wrangler.toml; then
              echo "- ⚠️ GROUP_CHAT_ID не задан: напишите в группе /chatid, добавьте id в Settings → Variables → GROUP_CHAT_ID и перезапустите workflow"
            else
              echo "- Группа: $GROUP_CHAT_ID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
