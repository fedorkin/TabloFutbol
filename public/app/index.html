<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Табло</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #fff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --text: var(--tg-theme-text-color, #111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --btn: var(--tg-theme-button-color, #2f80ed);
    --btn-text: var(--tg-theme-button-text-color, #fff);
    --danger: var(--tg-theme-destructive-text-color, #e5484d);
    --A: #2ea043;
    --B: #f2994a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 16px/1.35 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  main { padding: 12px 16px 96px; max-width: 640px; margin: 0 auto; }
  h2 { font-size: 15px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .02em; margin: 20px 0 8px; }
  .muted { color: var(--hint); font-size: 14px; }
  .center { text-align: center; }
  .game { text-align: center; color: var(--hint); font-size: 14px; }
  .score { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 4px; }
  .score .n { font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 1.2em; text-align: center; }
  .score .sep { font-size: 36px; color: var(--hint); }
  .score .t { font-size: 13px; color: var(--hint); width: 80px; }
  .score .t.A { text-align: right; }
  .dotA, .dotB { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; }
  .dotA { background: var(--A); } .dotB { background: var(--B); }
  .tabs { display: flex; gap: 6px; background: var(--bg2); padding: 4px; border-radius: 12px; margin: 12px 0 4px; }
  .tabs button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 9px 4px; border-radius: 9px; font: inherit; font-size: 14px; }
  .tabs button.on { background: var(--bg); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .seg button { border: 2px solid transparent; background: var(--bg2); color: var(--text); border-radius: 12px; padding: 10px 4px; font: inherit; font-size: 14px; }
  .seg button.on.A { border-color: var(--A); } .seg button.on.B { border-color: var(--B); } .seg button.on.W { border-color: var(--hint); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pbtn { min-height: 58px; border: 0; border-radius: 14px; font: inherit; font-weight: 600; color: #fff; padding: 8px; }
  .pbtn.A { background: var(--A); } .pbtn.B { background: var(--B); }
  .pbtn:active, .btn:active { transform: scale(.97); }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 13px; font: inherit; font-weight: 600; background: var(--btn); color: var(--btn-text); margin-top: 8px; }
  .btn.ghost { background: var(--bg2); color: var(--text); font-weight: 500; }
  .btn.danger { background: transparent; color: var(--danger); }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .feed { list-style: none; padding: 0; margin: 0; }
  .feed li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--bg2); }
  .feed .time { color: var(--hint); font-size: 13px; width: 42px; font-variant-numeric: tabular-nums; }
  .feed .what { flex: 1; }
  .feed .sub { color: var(--hint); font-size: 13px; }
  .feed .x { border: 0; background: var(--bg2); color: var(--hint); width: 34px; height: 34px; border-radius: 50%; font-size: 15px; }
  .pending { opacity: .55; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .col { background: var(--bg2); border-radius: 14px; padding: 10px; border-top: 4px solid; }
  .col.A { border-color: var(--A); } .col.B { border-color: var(--B); }
  .col h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; }
  .chip { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: var(--bg); color: var(--text); border-radius: 10px; padding: 9px 10px; margin-bottom: 6px; font: inherit; font-size: 15px; text-align: left; }
  .chip small { color: var(--hint); }
  .rate { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--bg2); }
  .rate .name { flex: 1; }
  .rate .nm { border: 0; background: transparent; color: var(--text); font: inherit; text-align: left; padding: 0; }
  .rate .sub { color: var(--hint); font-size: 13px; }
  .input { width: 100%; font: inherit; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid var(--bg2); background: var(--bg2); color: var(--text); } .rate .val { width: 56px; height: 40px; border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 700; text-decoration: underline dotted; text-underline-offset: 4px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rate button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--bg2); color: var(--text); font-size: 20px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; z-index: 10; }
  .sheet { background: var(--bg); width: 100%; max-height: 85vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 12px; font-size: 18px; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); background: #222; color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 15px; z-index: 20; display: flex; gap: 10px; align-items: center; }
  .toast button { border: 0; background: transparent; color: #8ab4ff; font: inherit; font-weight: 600; margin-left: auto; }
  .banner { background: var(--bg2); border-radius: 12px; padding: 12px; margin-top: 12px; font-size: 14px; }
  .empty { padding: 32px 8px; text-align: center; color: var(--hint); }
  .card { display: flex; align-items: center; width: 100%; border: 0; background: var(--bg2); color: var(--text); border-radius: 12px; padding: 12px; margin-bottom: 8px; font: inherit; text-align: left; }
  .card .grow { flex: 1; }
  .card .sc { font-weight: 700; font-variant-numeric: tabular-nums; }
  table.st { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  table.st th { color: var(--hint); font-weight: 500; text-align: right; padding: 6px 4px; font-size: 12px; }
  table.st td { text-align: right; padding: 9px 4px; border-bottom: 1px solid var(--bg2); }
  table.st th:nth-child(2), table.st td:nth-child(2) { text-align: left; }
  table.st tr[data-a] { cursor: pointer; }
  .up { color: #1a7f37; font-weight: 600; } .down { color: var(--danger); }
  .spark { width: 100%; height: 70px; display: block; margin: 8px 0; }
</style>
</head>
<body>
<main id="app"><div class="empty">Загрузка…</div></main>
<div id="sheet"></div>
<div id="toast"></div>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = (tg && tg.initData) || "";

  // ---------- хранилище (может быть недоступно) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem("tablo:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("tablo:" + k, JSON.stringify(v)); } catch {} },
  };

  const S = {
    data: null,
    error: null,
    tab: "board",
    side: store.get("side", null),      // "A" | "B" | "W" (смотрю)
    queue: store.get("queue", []),      // офлайн-очередь: {kind:"event", body} | {kind:"cancel", id}
    sheet: null,                        // {kind:"assist", scorerId} | {kind:"own"}
    players: null,                      // рейтинги (админ)
    history: null,                      // {matches, stats}
    histView: "matches",                // "matches" | "stats"
    busy: false,
  };

  // ---------- утилиты ----------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
  const haptic = (t) => { try { tg.HapticFeedback.notificationOccurred(t); } catch {} };
  const tap = () => { try { tg.HapticFeedback.impactOccurred("light"); } catch {} };
  const confirmBox = (msg) => new Promise((res) => {
    try { if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) return tg.showConfirm(msg, res); } catch {}
    res(window.confirm(msg));
  });
  const hhmm = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); };
  const other = (t) => (t === "A" ? "B" : "A");

  let toastTimer;
  function toast(text, action) {
    const el = document.getElementById("toast");
    el.innerHTML = `<div class="toast"><span>${esc(text)}</span>${action ? `<button id="toast-act">${esc(action.label)}</button>` : ""}</div>`;
    if (action) document.getElementById("toast-act").onclick = () => { el.innerHTML = ""; action.fn(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => (el.innerHTML = ""), action ? 5000 : 3000);
  }

  async function api(method, path, body) {
    const r = await fetch("/api" + path, {
      method,
      headers: { "X-Init-Data": initData, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const json = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(json.error || "Ошибка " + r.status); e.status = r.status; throw e; }
    return json;
  }

  // ---------- данные ----------
  async function load() {
    try {
      S.data = await api("GET", "/state");
      S.error = null;
    } catch (e) {
      if (e.status) S.error = e.message; // сетевые ошибки молча переживаем — покажем последнее состояние
    }
    render();
  }

  function saveQueue() { store.set("queue", S.queue); }

  let flushing = false;
  async function flush() {
    if (flushing || !S.queue.length) return;
    flushing = true;
    try {
      while (S.queue.length) {
        const item = S.queue[0];
        try {
          if (item.kind === "event") await api("POST", "/events", item.body);
          else await api("POST", "/events/" + encodeURIComponent(item.id) + "/cancel");
        } catch (e) {
          if (!e.status || e.status >= 500) break;        // нет сети — попробуем позже
          toast(e.message); haptic("error");               // ошибка данных — выкидываем
        }
        S.queue.shift(); saveQueue();
      }
    } finally {
      flushing = false;
    }
    await load();
  }

  // ---------- действия ----------
  const M = () => S.data && S.data.match;
  const P = (id) => (M() ? M().players.find((p) => p.id === id) : null);
  const name = (id) => (P(id) ? P(id).name : (M() && M().names && M().names[id]) || "?");

  function addEvent(body) {
    body.id = uid();
    S.queue.push({ kind: "event", body }); saveQueue();
    S.sheet = null;
    haptic("success");
    const text = body.type === "own_goal" ? `Автогол: ${name(body.scorerId)}` : `Гол: ${name(body.scorerId)}${body.assistId ? ` (пас ${name(body.assistId)})` : ""}`;
    toast(text, { label: "Отменить", fn: () => cancelEvent(body.id, true) });
    render(); flush();
  }

  async function cancelEvent(id, skipConfirm) {
    if (!skipConfirm && !(await confirmBox("Отменить этот гол?"))) return;
    const i = S.queue.findIndex((q) => q.kind === "event" && q.body.id === id);
    if (i > 0 || (i === 0 && !flushing)) S.queue.splice(i, 1);      // ещё не отправлен — просто убираем
    else S.queue.push({ kind: "cancel", id });
    saveQueue(); render(); flush();
  }

  async function adminCall(method, path, body, okText) {
    if (S.busy) return;
    S.busy = true; render();
    try { await api(method, path, body); if (okText) toast(okText); haptic("success"); }
    catch (e) { toast(e.message); haptic("error"); }
    finally { S.busy = false; await load(); }
  }

  function moveTo(pid, team) {
    const m = M(); if (!m) return;
    const A = m.players.filter((p) => p.team === "A" && p.id !== pid).map((p) => p.id);
    const B = m.players.filter((p) => p.team === "B" && p.id !== pid).map((p) => p.id);
    if (team === "A") A.push(pid); else if (team === "B") B.push(pid);
    tap();
    adminCall("PUT", "/teams", { A, B });
  }

  async function loadPlayers() {
    try { S.players = (await api("GET", "/players")).players; } catch (e) { toast(e.message); }
    render();
  }
  const skillTimers = {};
  function setSkill(id, delta) {
    const p = S.players.find((x) => x.id === id); if (!p) return;
    p.skill = Math.round(Math.max(1, Math.min(10, p.skill + delta)) * 100) / 100; tap(); render();
    clearTimeout(skillTimers[id]);
    skillTimers[id] = setTimeout(() => api("PUT", `/players/${id}/skill`, { skill: p.skill }).catch((e) => toast(e.message)), 500);
  }

  async function openSkill(id) {
    S.sheet = { kind: "skill", id, data: null }; render();
    setTimeout(() => { const i = document.getElementById("skill-input"); if (i) { i.focus(); i.select(); } }, 50);
    try { const data = await api("GET", `/players/${id}/history`); if (S.sheet && S.sheet.kind === "skill" && S.sheet.id === id) S.sheet.data = data; }
    catch (e) { toast(e.message); }
    render();
  }

  const parseSkill = (v) => Math.round(Number(String(v).replace(",", ".").trim()) * 100) / 100;

  async function saveSkill(id) {
    const v = parseSkill(document.getElementById("skill-input").value);
    if (!(v >= 1 && v <= 10)) { toast("Оценка от 1 до 10, например 6,3"); haptic("error"); return; }
    try {
      await api("PUT", `/players/${id}/skill`, { skill: v });
      const p = S.players.find((x) => x.id === id); if (p) p.skill = v;
      S.sheet = null; haptic("success"); toast("Оценка сохранена");
    } catch (e) { toast(e.message); haptic("error"); }
    render();
  }

  async function saveName(id, name) {
    try {
      const r = await api("PUT", `/players/${id}/name`, { name });
      const p = S.players.find((x) => x.id === id);
      if (p) { p.name = r.name; p.renamed = !!name; }
      S.sheet = null; haptic("success"); toast("Имя сохранено");
    } catch (e) { toast(e.message); haptic("error"); }
    render(); load();
  }

  // ---------- отрисовка ----------
  function events() {
    const m = M(); if (!m) return [];
    const cancelled = new Set(S.queue.filter((q) => q.kind === "cancel").map((q) => q.id));
    const server = m.events.filter((e) => !e.cancelled && !cancelled.has(e.id));
    const known = new Set(m.events.map((e) => e.id));
    const pending = S.queue
      .filter((q) => q.kind === "event" && !known.has(q.body.id))
      .map((q) => {
        const scorer = P(q.body.scorerId);
        const team = scorer ? (q.body.type === "own_goal" ? other(scorer.team) : scorer.team) : "A";
        return { id: q.body.id, type: q.body.type, team, scorerId: q.body.scorerId, assistId: q.body.assistId, createdAt: new Date().toISOString(), pending: true };
      });
    return [...server, ...pending];
  }

  function scoreView() {
    const d = S.data, ev = events();
    const s = { A: ev.filter((e) => e.team === "A").length, B: ev.filter((e) => e.team === "B").length };
    const tn = d.teamNames;
    return `
      <div class="game">${esc(d.game.title)}${d.game.time ? ", " + esc(d.game.time) : ""}</div>
      ${M() && M().phase !== "draft" ? `<div class="score">
        <div class="t A">${esc(tn.A)}</div><div class="n">${s.A}</div><div class="sep">:</div><div class="n">${s.B}</div><div class="t">${esc(tn.B)}</div>
      </div>` : ""}`;
  }

  function boardView() {
    const d = S.data, m = M();
    if (!m) return `<div class="empty">Составы ещё не собраны.</div>
      ${d.me.isAdmin ? `<button class="btn" data-a="auto" data-mode="best">⚖️ Собрать команды по рейтингу</button>` : ""}`;

    const ev = events().slice().reverse();
    const feed = ev.length ? `<ul class="feed">${ev.map((e) => `
        <li class="${e.pending ? "pending" : ""}">
          <span class="time">${e.pending ? "⏳" : hhmm(e.createdAt)}</span>
          <span class="dot${e.team}"></span>
          <span class="what">${e.type === "own_goal" ? `${esc(name(e.scorerId))} <span class="sub">автогол</span>` : esc(name(e.scorerId))}
            ${e.assistId ? `<div class="sub">пас: ${esc(name(e.assistId))}</div>` : ""}</span>
          ${m.status === "open" ? `<button class="x" data-a="cancel" data-id="${esc(e.id)}" aria-label="Отменить">✕</button>` : ""}
        </li>`).join("")}</ul>` : `<div class="muted center" style="padding:12px">Голов пока нет</div>`;

    if (m.status === "finished") {
      return `<div class="banner center">🏁 Матч завершён, итог отправлен в группу</div>
        <h2>Голы</h2>${feed}
        ${d.me.isAdmin ? `<button class="btn ghost" data-a="reopen">Открыть матч снова</button>` : ""}`;
    }

    const tn = d.teamNames;
    if (m.phase === "draft") {
      const a = m.players.filter((p) => p.team === "A").length, b = m.players.filter((p) => p.team === "B").length;
      return `<div class="banner center">⏳ Игра ещё не началась<br><span class="muted">Составы ${a} × ${b} — до старта их можно пересобирать на вкладке «Составы»</span></div>
        ${d.me.isAdmin
          ? `<button class="btn" data-a="kickoff" ${!a || !b ? "disabled" : ""}>▶️ Начать игру</button>
             <p class="muted center">После старта включится отметка голов, запись на игру закроется, в группу уйдут составы.</p>`
          : `<p class="muted center">Админ начнёт игру${d.game.time ? " в " + esc(d.game.time) : ""} — тогда здесь появятся кнопки для голов.</p>`}
        <h2>Этот телефон</h2>
        <div class="seg">
          <button class="A ${S.side === "A" ? "on" : ""}" data-a="side" data-side="A">У ворот<br><span class="dotA"></span> ${esc(tn.A.split(" ").slice(1).join(" "))}</button>
          <button class="B ${S.side === "B" ? "on" : ""}" data-a="side" data-side="B">У ворот<br><span class="dotB"></span> ${esc(tn.B.split(" ").slice(1).join(" "))}</button>
          <button class="W ${S.side === "W" || !S.side ? "on" : ""}" data-a="side" data-side="W">👀<br>Смотрю</button>
        </div>
        <p class="muted">Можно выбрать заранее — после старта сразу появятся кнопки.</p>`;
    }
    let entry = "";
    if (S.side === "A" || S.side === "B") {
      const attack = other(S.side);
      const shooters = m.players.filter((p) => p.team === attack);
      entry = `<h2>Гол в ворота ${esc(tn[S.side])} — кто забил?</h2>
        <div class="grid">${shooters.map((p) => `<button class="pbtn ${attack}" data-a="scorer" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>
        <button class="btn ghost" data-a="own">Автогол</button>`;
    } else {
      entry = `<div class="banner">Выберите ворота, у которых стоит этот телефон — появятся кнопки для отметки голов.</div>`;
    }

    return `<h2>Этот телефон</h2>
      <div class="seg">
        <button class="A ${S.side === "A" ? "on" : ""}" data-a="side" data-side="A">У ворот<br><span class="dotA"></span> ${esc(tn.A.split(" ").slice(1).join(" "))}</button>
        <button class="B ${S.side === "B" ? "on" : ""}" data-a="side" data-side="B">У ворот<br><span class="dotB"></span> ${esc(tn.B.split(" ").slice(1).join(" "))}</button>
        <button class="W ${S.side === "W" || !S.side ? "on" : ""}" data-a="side" data-side="W">👀<br>Смотрю</button>
      </div>
      ${entry}
      <h2>Голы</h2>${feed}
      ${d.me.isAdmin ? `<button class="btn danger" data-a="finish">🏁 Завершить матч и отправить итог</button>
        ${!ev.length ? `<button class="btn ghost" data-a="unstart">↩️ Отменить старт</button>` : ""}` : ""}`;
  }

  function teamsView() {
    const d = S.data, m = M(), admin = d.me.isAdmin;
    if (!m) {
      return `<h2>Основной состав (${d.roster.length})</h2>
        ${d.roster.map((p) => `<div class="chip">${esc(p.name)}${admin ? `<small>${fmtSkill(p.skill)}</small>` : ""}</div>`).join("") || `<div class="muted">Пока никто не записался</div>`}
        ${admin ? `<button class="btn" data-a="auto" data-mode="best" ${d.roster.length < 2 ? "disabled" : ""}>⚖️ Собрать команды по рейтингу</button>` : ""}`;
    }
    const inTeams = new Set(m.players.map((p) => p.id));
    const free = d.roster.filter((p) => !inTeams.has(p.id));
    const col = (t) => {
      const ps = m.players.filter((p) => p.team === t);
      const sum = ps.reduce((s, p) => s + (p.skill || 0), 0);
      return `<div class="col ${t}"><h3><span>${esc(d.teamNames[t])}</span><span class="muted">${ps.length}${admin ? ` · Σ${fmtSkill(sum)}` : ""}</span></h3>
        ${ps.map((p) => admin
          ? `<button class="chip" data-a="move" data-id="${p.id}" data-to="${other(t)}">${esc(p.name)}<small>${fmtSkill(p.skill)} ⇄</small></button>`
          : `<div class="chip">${esc(p.name)}</div>`).join("")}</div>`;
    };
    return `<div class="cols">${col("A")}${col("B")}</div>
      ${admin ? `<p class="muted">Нажмите на игрока, чтобы перевести его в другую команду.</p>` : ""}
      ${free.length ? `<h2>Записались, но не в составах</h2>
        ${free.map((p) => admin
          ? `<div class="row"><button class="chip" data-a="move" data-id="${p.id}" data-to="A">+ ${esc(p.name)} → <span class="dotA"></span></button><button class="chip" data-a="move" data-id="${p.id}" data-to="B" style="flex:0 0 64px;justify-content:center"><span class="dotB"></span></button></div>`
          : `<div class="chip">${esc(p.name)}</div>`).join("")}` : ""}
      ${admin && m.status === "open" ? `<h2>Убрать из состава</h2><p class="muted">Ушёл до конца игры — уберите, голы и пасы сохранятся.</p>
        ${m.players.map((p) => `<button class="chip" data-a="move" data-id="${p.id}" data-to="">${esc(p.name)}<small>убрать</small></button>`).join("")}` : ""}
      ${admin && m.phase === "draft" ? `<div class="row"><button class="btn ghost" data-a="auto" data-mode="shuffle">🎲 Другой вариант</button><button class="btn ghost" data-a="auto" data-mode="best">⚖️ Ровнее</button></div>
        <button class="btn" data-a="kickoff">▶️ Начать игру</button>` : ""}
      ${admin && m.phase === "live" ? `<p class="muted">Игра идёт — составы правятся только вручную.</p>` : ""}`;
  }

  const fmtD = (d) => `<span class="${d > 0 ? "up" : d < 0 ? "down" : "muted"}">${d > 0 ? "+" : d < 0 ? "−" : "±"}${Math.abs(d).toFixed(2).replace(".", ",")}</span>`;
  const resultMark = { W: "✅", D: "🤝", L: "❌" };

  async function loadHistory() {
    try { S.history = await api("GET", "/history"); } catch (e) { toast(e.message); S.history = { matches: [], stats: [] }; }
    render();
  }

  function historyView() {
    if (!S.history) { loadHistory(); return `<div class="empty">Загрузка…</div>`; }
    const { matches, stats } = S.history;
    const seg = `<div class="tabs" style="margin-top:12px">
      <button data-a="hist" data-v="matches" class="${S.histView === "matches" ? "on" : ""}">Матчи</button>
      <button data-a="hist" data-v="stats" class="${S.histView === "stats" ? "on" : ""}">Статистика</button></div>`;
    if (S.histView === "matches") {
      return seg + (matches.length ? matches.map((m) => `
        <button class="card" data-a="match" data-id="${m.id}">
          <span class="grow">${esc(m.title)}${m.status === "open" ? ` <span class="muted">· ${m.started ? "идёт" : "составы собраны"}</span>` : ""}</span>
          <span class="sc"><span class="dotA"></span> ${m.score.A} : ${m.score.B} <span class="dotB"></span></span>
        </button>`).join("") : `<div class="empty">Матчей пока не было</div>`);
    }
    if (!stats.length) return seg + `<div class="empty">Статистика появится после первого завершённого матча</div>`;
    return seg + `<table class="st"><tr><th>#</th><th>Игрок</th><th>И</th><th>В-Н-П</th><th>⚽</th><th>🅰️</th>${S.data.me.isAdmin ? "<th>Рейт.</th>" : ""}</tr>
      ${stats.map((p, i) => `<tr data-a="player" data-id="${p.id}"><td>${i + 1}</td><td>${esc(p.name)}</td><td>${p.games}</td>
        <td>${p.wins}-${p.draws}-${p.losses}</td><td><b>${p.goals}</b></td><td>${p.assists}</td>${S.data.me.isAdmin ? `<td>${p.skill.toFixed(1)}</td>` : ""}</tr>`).join("")}
      </table><p class="muted">И — игры, В-Н-П — победы, ничьи, поражения. Нажмите на игрока — его матчи.</p>`;
  }

  async function openMatch(id) {
    S.sheet = { kind: "match", id, data: null }; render();
    try { S.sheet.data = await api("GET", "/history/" + id); } catch (e) { toast(e.message); S.sheet = null; }
    render();
  }

  async function openPlayer(id) {
    S.sheet = { kind: "player", id, data: null }; render();
    try { S.sheet.data = await api("GET", `/players/${id}/history`); } catch (e) { toast(e.message); S.sheet = null; }
    render();
  }

  function sparkline(values, marks = []) {
    if (values.length < 2) return "";
    const w = 300, h = 70, pad = 6, min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
    const pts = values.map((v, i) => `${(pad + (i * (w - 2 * pad)) / (values.length - 1)).toFixed(1)},${(h - pad - ((v - min) * (h - 2 * pad)) / span).toFixed(1)}`);
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--btn)" stroke-width="2.5" stroke-linejoin="round"/>${marks.map((i) => { const [x, y] = pts[i].split(","); return `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--bg)" stroke="var(--B)" stroke-width="2.5"/>`; }).join("")}</svg>`;
  }

  function matchSheet(d) {
    const nm = (id) => { const p = d.players.find((x) => x.id === id); return p ? p.name : (d.names && d.names[id]) || "?"; };
    const delta = new Map(d.ratings.map((r) => [r.playerId, r]));
    const col = (t) => `<div class="col ${t}"><h3><span>${esc(S.data.teamNames[t])}</span></h3>
      ${d.players.filter((p) => p.team === t).map((p) => { const r = delta.get(p.id);
        return `<div class="chip">${esc(p.name)}${r ? `<small>${r.after != null ? r.after.toFixed(1) + " " : ""}${fmtD(r.delta)}</small>` : ""}</div>`; }).join("")}</div>`;
    return `<h3>${esc(d.title)}</h3>
      <div class="score"><div class="n">${d.score.A}</div><div class="sep">:</div><div class="n">${d.score.B}</div></div>
      ${d.events.length ? `<ul class="feed">${d.events.map((e) => `<li><span class="time">${hhmm(e.createdAt)}</span><span class="dot${e.team}"></span>
        <span class="what">${esc(nm(e.scorerId))}${e.type === "own_goal" ? ' <span class="sub">автогол</span>' : ""}${e.assistId ? `<div class="sub">пас: ${esc(nm(e.assistId))}</div>` : ""}</span></li>`).join("")}</ul>` : `<p class="muted center">Голов не было</p>`}
      <h2>Составы${d.ratings.length ? " и рейтинг" : ""}</h2><div class="cols">${col("A")}${col("B")}</div>`;
  }

  /** Матчи и ручные правки игрока в хронологическом порядке (только у админа есть after/at/edits). */
  function timeline(d) {
    const items = [
      ...d.matches.filter((m) => m.after != null).map((m) => ({ kind: "match", at: m.at || m.date, before: Math.round((m.after - m.delta) * 100) / 100, after: m.after, m })),
      ...(d.edits || []).map((e) => ({ kind: "edit", at: e.at, before: e.before, after: e.after, e })),
    ];
    return items.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
  }
  const shortDate = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }); };
  function logLine(it) {
    if (it.kind === "edit") return `<li><span class="time">${esc(shortDate(it.at))}</span><span class="what">✎ ${esc(it.e.by)}: ${fmtSkill(it.before)} → <b>${fmtSkill(it.after)}</b></span></li>`;
    return `<li><span class="time">${esc(shortDate(it.m.date))}</span><span class="what">${resultMark[it.m.result]} матч ${fmtD(it.m.delta)} → <b>${fmtSkill(it.after)}</b></span></li>`;
  }

  function playerSheet(d) {
    const n = d.matches.length;
    const sum = (k) => d.matches.reduce((s, m) => s + m[k], 0);
    const wins = d.matches.filter((m) => m.result === "W").length;
    const tl = timeline(d);
    return `<h3>${esc(d.name)}</h3>
      <p class="muted">${n} игр · ${wins} побед${n ? ` (${Math.round((100 * wins) / n)}%)` : ""} · ${sum("goals")} ⚽ · ${sum("assists")} 🅰️${d.skill != null ? ` · рейтинг ${d.skill.toFixed(2)}` : ""}</p>
      ${tl.length ? `<h2>Рейтинг</h2>${sparkline([tl[0].before, ...tl.map((x) => x.after)], tl.map((x, i) => (x.kind === "edit" ? i + 1 : -1)).filter((i) => i > 0))}
        <ul class="feed">${tl.slice().reverse().slice(0, 8).map(logLine).join("")}</ul>
        <p class="muted">✎ — ручная правка админа, точки на графике.</p>` : ""}
      <h2>Матчи</h2>
      ${n ? d.matches.map((m) => `<button class="card" data-a="match" data-id="${m.matchId}">
        <span class="grow">${resultMark[m.result]} ${esc(m.title)}<div class="sub muted">${m.goals ? m.goals + " ⚽ " : ""}${m.assists ? m.assists + " 🅰️ " : ""}${m.ownGoals ? m.ownGoals + " автогол" : ""}</div></span>
        <span class="sc"><span class="dot${m.team}"></span> ${m.score[m.team]} : ${m.score[m.team === "A" ? "B" : "A"]}</span>&nbsp;${fmtD(m.delta)}</button>`).join("") : `<p class="muted">Завершённых матчей пока нет</p>`}`;
  }

  const fmtSkill = (x) => String(Math.round(x * 100) / 100).replace(".", ",");

  function ratingsView() {
    if (!S.players) { loadPlayers(); return `<div class="empty">Загрузка…</div>`; }
    return `<p class="muted">Оценка 1–10 для деления на команды — видят только админы. Нажмите на имя, чтобы переименовать, на число — чтобы задать точное значение.</p>
      ${S.players.map((p) => `<div class="rate"><button class="name nm" data-a="rename" data-id="${p.id}">${esc(p.name)} ✎
          <div class="sub">${p.guest ? "гость" : esc([p.renamed ? p.tgName : "", p.username ? "@" + p.username : ""].filter(Boolean).join(" · "))}</div></button>
        <button data-a="skill" data-id="${p.id}" data-d="-1">−</button><button class="val" data-a="skilledit" data-id="${p.id}">${fmtSkill(p.skill)}</button><button data-a="skill" data-id="${p.id}" data-d="1">+</button></div>`).join("")}`;
  }

  function sheetView() {
    const m = M(); if (!S.sheet) return "";
    if (["assist", "own"].includes(S.sheet.kind) && !m) return "";
    if (S.sheet.kind === "assist") {
      const scorer = P(S.sheet.scorerId); if (!scorer) return "";
      const mates = m.players.filter((p) => p.team === scorer.team && p.id !== scorer.id);
      return `<div class="sheet-bg" data-a="close"><div class="sheet" data-stop>
        <h3>⚽ ${esc(scorer.name)} — кто отдал пас?</h3>
        <div class="grid">${mates.map((p) => `<button class="pbtn ${scorer.team}" data-a="assist" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>
        <button class="btn" data-a="assist" data-id="">Без паса</button>
        <button class="btn ghost" data-a="close">Отмена</button></div></div>`;
    }
    if (S.sheet.kind === "match" || S.sheet.kind === "player") {
      const body = !S.sheet.data ? `<div class="empty">Загрузка…</div>` : S.sheet.kind === "match" ? matchSheet(S.sheet.data) : playerSheet(S.sheet.data);
      return `<div class="sheet-bg" data-a="close"><div class="sheet" data-stop>${body}<button class="btn ghost" data-a="close">Закрыть</button></div></div>`;
    }
    if (S.sheet.kind === "skill") {
      const p = (S.players || []).find((x) => x.id === S.sheet.id); if (!p) return "";
      const d = S.sheet.data;
      const tl = d ? timeline(d) : [];
      return `<div class="sheet-bg" data-a="close"><div class="sheet" data-stop>
        <h3>Оценка: ${esc(p.name)}</h3>
        <input class="input" id="skill-input" inputmode="decimal" value="${fmtSkill(p.skill)}" autocomplete="off" style="font-size:28px;text-align:center;font-weight:700">
        <div class="row" style="margin-top:8px">${[-1, -0.1, 0.1, 1].map((x) => `<button class="btn ghost" style="margin:0" data-a="skillstep" data-d="${x}">${x > 0 ? "+" : "−"}${String(Math.abs(x)).replace(".", ",")}</button>`).join("")}</div>
        <button class="btn" data-a="skill-save">Сохранить</button>
        <h2>История</h2>
        ${!d ? `<div class="muted">Загрузка…</div>` : tl.length ? `<ul class="feed">${tl.slice().reverse().slice(0, 6).map(logLine).join("")}</ul>` : `<p class="muted">Матчей и правок пока не было</p>`}
        <button class="btn ghost" data-a="close">Отмена</button></div></div>`;
    }
    if (S.sheet.kind === "rename") {
      const p = (S.players || []).find((x) => x.id === S.sheet.id); if (!p) return "";
      return `<div class="sheet-bg" data-a="close"><div class="sheet" data-stop>
        <h3>Как показывать игрока?</h3>
        ${p.guest ? "" : `<p class="muted">В Telegram: ${esc(p.tgName || "")}${p.username ? " · @" + esc(p.username) : ""}</p>`}
        <input class="input" id="rename-input" maxlength="40" value="${esc(p.name)}" autocomplete="off">
        <button class="btn" data-a="rename-save">Сохранить</button>
        ${!p.guest && p.renamed ? `<button class="btn ghost" data-a="rename-reset">Вернуть имя из Telegram</button>` : ""}
        <button class="btn ghost" data-a="close">Отмена</button></div></div>`;
    }
    if (S.sheet.kind === "own") {
      const own = m.players.filter((p) => p.team === S.side);
      return `<div class="sheet-bg" data-a="close"><div class="sheet" data-stop>
        <h3>Кто забил в свои ворота?</h3>
        <div class="grid">${own.map((p) => `<button class="pbtn ${p.team}" data-a="ownby" data-id="${p.id}">${esc(p.name)}</button>`).join("")}</div>
        <button class="btn ghost" data-a="close">Отмена</button></div></div>`;
    }
    return "";
  }

  function render() {
    const app = document.getElementById("app");
    if (!initData) { app.innerHTML = `<div class="empty">Откройте табло из Telegram: кнопка «📲 Открыть табло» в группе или команда /tablo</div>`; return; }
    if (S.error && !S.data) { app.innerHTML = `<div class="empty">${esc(S.error)}</div>`; return; }
    if (!S.data) return;
    const d = S.data;
    if (!d.game) { app.innerHTML = `<div class="empty">Ближайшей игры нет.<br>Админ создаёт запись командой /game</div>`; return; }
    const cancelledBanner = d.game.cancelled
      ? `<div class="banner center">❌ Игра ${esc(d.game.title)} отменена${d.game.cancelReason ? ": " + esc(d.game.cancelReason) : ""}</div>`
      : "";
    if (S.tab === "ratings" && !d.me.isAdmin) S.tab = "board";
    if (d.game.cancelled && (S.tab === "board" || S.tab === "teams")) S.tab = "history";
    const tabs = d.game.cancelled
      ? [["history", "История"], ...(d.me.isAdmin ? [["ratings", "Игроки"]] : [])]
      : [["board", "Табло"], ["teams", "Составы"], ["history", "История"], ...(d.me.isAdmin ? [["ratings", "Игроки"]] : [])];
    app.innerHTML = `${d.game.cancelled ? cancelledBanner : scoreView()}
      <div class="tabs">${tabs.map(([k, l]) => `<button data-a="tab" data-tab="${k}" class="${S.tab === k ? "on" : ""}">${l}</button>`).join("")}</div>
      ${S.queue.length ? `<div class="muted center">⏳ Не отправлено: ${S.queue.length} — отправлю, как появится связь</div>` : ""}
      ${S.tab === "board" ? boardView() : S.tab === "teams" ? teamsView() : S.tab === "history" ? historyView() : ratingsView()}`;
    // шторку с полем ввода не перерисовываем при поллинге — иначе пропадёт набранный текст и клавиатура
    const key = S.sheet ? JSON.stringify(S.sheet) : "";
    // то же для карточек истории — иначе сбрасывается прокрутка
    if (!(S.sheet && ["rename", "skill", "match", "player"].includes(S.sheet.kind) && key === renderedSheet)) {
      const active = document.activeElement && document.activeElement.id ? { id: document.activeElement.id, v: document.activeElement.value } : null;
      document.getElementById("sheet").innerHTML = sheetView();
      renderedSheet = key;
      if (active && active.v != null) { const el = document.getElementById(active.id); if (el) { el.value = active.v; el.focus(); } }
    }
  }
  let renderedSheet = "";

  // ---------- обработчики (делегирование) ----------
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-a]");
    if (!el) return;
    if (el.classList.contains("sheet-bg") && ev.target.closest("[data-stop]")) return; // клик внутри шторки
    const a = el.dataset.a, id = el.dataset.id;
    switch (a) {
      case "tab":
        S.tab = el.dataset.tab; tap();
        if (S.tab === "history") S.history = null; // при каждом открытии — свежие данные
        render(); break;
      case "hist": S.histView = el.dataset.v; tap(); render(); break;
      case "match": tap(); openMatch(Number(id)); break;
      case "player": tap(); openPlayer(Number(id)); break;
      case "side": S.side = el.dataset.side; store.set("side", S.side); tap(); render(); break;
      case "scorer": S.sheet = { kind: "assist", scorerId: Number(id) }; tap(); render(); break;
      case "assist": addEvent({ type: "goal", scorerId: S.sheet.scorerId, assistId: id ? Number(id) : null }); break;
      case "own": S.sheet = { kind: "own" }; tap(); render(); break;
      case "ownby": addEvent({ type: "own_goal", scorerId: Number(id) }); break;
      case "close": S.sheet = null; render(); break;
      case "cancel": cancelEvent(id); break;
      case "auto": adminCall("POST", "/teams/auto", { mode: el.dataset.mode }, "Команды собраны").then(() => { S.tab = "teams"; render(); }); break;
      case "move": moveTo(Number(id), el.dataset.to); break;
      case "skill": setSkill(Number(id), Number(el.dataset.d)); break;
      case "rename":
        S.sheet = { kind: "rename", id: Number(id) }; render();
        setTimeout(() => { const i = document.getElementById("rename-input"); if (i) { i.focus(); i.select(); } }, 50);
        break;
      case "rename-save": {
        const v = (document.getElementById("rename-input").value || "").trim();
        if (!v) { toast("Введите имя"); break; }
        saveName(S.sheet.id, v); break;
      }
      case "rename-reset": saveName(S.sheet.id, null); break;
      case "skilledit": tap(); openSkill(Number(id)); break;
      case "skillstep": {
        const i = document.getElementById("skill-input");
        const cur = parseSkill(i.value);
        const next = Math.round(Math.max(1, Math.min(10, (isNaN(cur) ? 5 : cur) + Number(el.dataset.d))) * 100) / 100;
        i.value = String(next).replace(".", ","); tap(); break;
      }
      case "skill-save": saveSkill(S.sheet.id); break;
      case "finish":
        if (S.queue.length) { toast("Сначала дождитесь отправки голов"); break; }
        confirmBox("Завершить матч и отправить итог в группу?").then((ok) => ok && adminCall("POST", "/finish", undefined, "Итог отправлен в группу"));
        break;
      case "reopen": adminCall("POST", "/reopen"); break;
      case "kickoff":
        confirmBox("Начать игру? Запись закроется, в группу уйдут составы.").then((ok) => ok && adminCall("POST", "/start", undefined, "Игра началась!").then(() => { S.tab = "board"; render(); }));
        break;
      case "unstart":
        confirmBox("Отменить старт? Можно будет снова пересобрать составы.").then((ok) => ok && adminCall("POST", "/unstart"));
        break;
    }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter" && ev.target.id === "rename-input") { ev.preventDefault(); document.querySelector('[data-a="rename-save"]').click(); }
    if (ev.key === "Enter" && ev.target.id === "skill-input") { ev.preventDefault(); document.querySelector('[data-a="skill-save"]').click(); }
  });

  // ---------- старт ----------
  render();
  load().then(flush);
  setInterval(() => { if (document.visibilityState === "visible") (S.queue.length ? flush() : load()); }, 3000);
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && load());
  window.addEventListener("online", flush);
})();
</script>
</body>
</html>
